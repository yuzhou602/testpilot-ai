# Test Configuration
server.port=8080

# H2 Database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable SQL init for tests
spring.sql.init.mode=never

# Redis (embedded or mock)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=TestPilotAI2024SecretKeyForJwtTokenGenerationMustBe32Bytes!!
jwt.expiration=86400000

# Spring AI - Mock for tests
spring.ai.openai.api-key=sk-test
spring.ai.openai.base-url=http://localhost:8081
spring.ai.openai.chat.options.model=gpt-4o

# Logging
logging.level.com.testpilot=DEBUG
logging.level.org.springframework=WARN
