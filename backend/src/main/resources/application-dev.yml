# Development Environment Configuration
server:
  port: 8080
  servlet:
    context-path: /

# Database - MySQL
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/testpilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Initialize with demo data
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # H2 Console (for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console

# JWT
jwt:
  secret: TestPilotAI2024SecretKeyForJwtTokenGenerationMustBe32Bytes!!
  expiration: 86400000

# Spring AI - OpenAI Compatible
spring.ai:
  openai:
    api-key: ${OPENAI_API_KEY:sk-placeholder}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    chat:
      options:
        model: ${OPENAI_MODEL:gpt-4o}

# Logging
logging:
  level:
    com.testpilot: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.web: DEBUG

# Jackson
jackson:
  serialization:
    write-dates-as-timestamps: false
  default-property-inclusion: non_null

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
