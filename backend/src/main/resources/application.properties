# Server
server.port=8080
server.servlet.context-path=/

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/testpilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Initialize with demo data (set to false after first run)
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=TestPilotAI2024SecretKeyForJwtTokenGenerationMustBe32Bytes!!
jwt.expiration=86400000

# Spring AI - OpenAI Compatible
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-placeholder}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}

# Spring AI - Alternative: use local Ollama
# spring.ai.openai.base-url=http://localhost:11434
# spring.ai.openai.chat.options.model=qwen2.5:14b

# Logging
logging.level.com.testpilot=DEBUG
logging.level.org.springframework.ai=DEBUG

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
