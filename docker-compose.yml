services:
  mysql:
    image: mysql:8.0
    container_name: testpilot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testpilot
      MYSQL_USER: testpilot
      MYSQL_PASSWORD: testpilot123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testpilot-network

  redis:
    image: redis:7-alpine
    container_name: testpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testpilot-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: testpilot-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/testpilot?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: testpilot
      SPRING_DATASOURCE_PASSWORD: testpilot123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      JWT_SECRET: TestPilotAI2024SecretKeyForJwtTokenGenerationMustBe32Bytes!!
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - testpilot-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: testpilot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - testpilot-network

volumes:
  mysql_data:
  redis_data:

networks:
  testpilot-network:
    driver: bridge
